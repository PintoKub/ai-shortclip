name: Windows exe

# Builds ShortClip.exe (PyInstaller cannot cross-compile, so this runs on a Windows runner).
# Download: Actions → this workflow run → Artifacts → ShortClip-windows.
# Pushing a tag like v1.0.0 also attaches the zip to a GitHub Release.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Unit tests (Windows)
        run: python -m unittest discover -s tests -v

      - name: Build ShortClip.exe
        run: python packaging/build_exe.py

      - name: Smoke test the exe
        shell: pwsh
        working-directory: dist/ShortClip
        run: |
          $ErrorActionPreference = "Stop"
          ./ShortClip.exe --help
          if ($LASTEXITCODE) { throw "help failed" }
          ./ShortClip.exe doctor          # informational: the runner may lack some tools
          $out = ./ShortClip.exe -c "import sys; print(sys.flags.utf8_mode)"
          if ($out -ne "1") { throw "UTF-8 mode is off: $out" }
          ./ShortClip.exe -c "from faster_whisper import WhisperModel; from pythainlp.tokenize import word_tokenize; from playwright.async_api import async_playwright; import edge_tts, requests; print(word_tokenize('สวัสดีครับ'))"
          if ($LASTEXITCODE) { throw "bundled imports failed" }
          ./ShortClip.exe -m edge_tts --help | Select-Object -First 1
          ./ShortClip.exe orchestrator --db "$env:RUNNER_TEMP\smoke.db" status
          if ($LASTEXITCODE) { throw "orchestrator failed" }
          $env:SHORTCLIP_NO_BROWSER = "1"
          $env:SHORTCLIP_NO_SYSTEMD = "1"
          $p = Start-Process -FilePath ./ShortClip.exe -ArgumentList "--port","8123" -PassThru -NoNewWindow `
                 -RedirectStandardOutput "$env:RUNNER_TEMP\dash.out" -RedirectStandardError "$env:RUNNER_TEMP\dash.err"
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-RestMethod http://127.0.0.1:8123/api/health; if ($r.ok) { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          Get-Content "$env:RUNNER_TEMP\dash.out", "$env:RUNNER_TEMP\dash.err"
          if (-not $ok) { throw "dashboard did not answer /api/health" }
          # fresh bundle for the artifact (the smoke test wrote .env, db/, .dashboard_pass)
          Remove-Item -Force -ErrorAction SilentlyContinue .env, .dashboard_pass
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue db/shortclip.db*, db/.dashboard_secret, db/actions.log

      - name: Zip
        shell: pwsh
        run: |
          Remove-Item dist/*.zip -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/ShortClip -DestinationPath dist/ShortClip-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ShortClip-windows
          path: dist/ShortClip-windows-x64.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ShortClip-windows
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ShortClip-windows-x64.zip --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes "Windows build: unzip, then double-click ShortClip.exe (see README-windows.txt)." \
          || gh release upload "$GITHUB_REF_NAME" ShortClip-windows-x64.zip --repo "$GITHUB_REPOSITORY" --clobber
